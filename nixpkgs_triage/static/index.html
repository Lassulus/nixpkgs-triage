<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nixpkgs-triage</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header id="top">
    <h1>nixpkgs-triage</h1>
    <span id="counts"></span>
    <span id="sync"></span>
    <button id="reload" hidden>new data, reload list</button>
  </header>
  <div id="layout">
    <nav id="categories" aria-label="categories"></nav>
    <main>
      <form id="toolbar"></form>
      <table id="prs">
        <thead>
          <tr>
            <th>PR</th><th>age</th><th>+/-</th><th>CI</th><th>conflict</th><th>draft</th>
            <th>mark</th><th>check</th><th>nixrev</th><th>category</th><th>title</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="end"></p>
    </main>
  </div>
</body>
</html>
